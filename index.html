<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      Tab favicon stays a 16px-readable moss ape-eye (deep moss + sumi ink).
      Home-screen / PWA icons use the ape logo so iOS does not fall back
      to a generated letter "A".
    -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='12' fill='%23171614'/><circle cx='32' cy='32' r='14' fill='none' stroke='%231B4636' stroke-width='4'/><circle cx='32' cy='32' r='4' fill='%231B4636'/></svg>" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="ApEditor" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#F4F1EA" />
    <!--
      Baseline CSP for a client-only SPA. connect-src allows HTTPS providers
      plus localhost (dev / local models). In-browser OCR needs
      wasm-unsafe-eval (WebAssembly.compile) and unsafe-eval (OpenCV.js
      embind uses the Function constructor). connect-src includes data:
      because OpenCV.js fetches its embedded WASM from a data: URL.
      Tighten further at the host layer if you pin to a single API origin.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval' 'unsafe-eval' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' data: https: http://localhost:* http://127.0.0.1:* ws://localhost:* ws://127.0.0.1:*; worker-src 'self' blob:; child-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self';"
    />
    <title>ApEditor — AI Markdown Editor</title>
  </head>
  <body class="h-full bg-ape-base text-cyber-primary antialiased">
    <div id="root" class="h-full"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
